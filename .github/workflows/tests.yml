# Runs tests.html on every push — the suite that pins the pure functions in
# index.html. There is no build step, so CI is exactly what a person does:
# serve the folder, open the page in a real browser, read the summary line.
# The job fails if the summary goes red or the page throws.
# Ported from Flow Metrics (team-dashboard).
name: tests

on:
  push:
    branches: [main]
  pull_request:

# `--omit=dev` matters: package.json declares the Firebase SDK so that Dependabot
# has a manifest to scan, and without this npm would helpfully download it here
# too. Nothing is ever installed from that entry — the bytes that run come from
# www.gstatic.com at page load, and a test pins the two to the same version.
#
# The npm install runs third-party postinstall scripts; a read-only token is
# the most they should ever be able to steal. Never rely on the repo default.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund --omit=dev playwright
          npx playwright install --with-deps chromium

      - name: Run tests.html headless
        run: |
          python3 -m http.server 8014 &
          # Written next to node_modules so `import 'playwright'` resolves.
          cat > ci-run-tests.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { appendFileSync } from 'node:fs';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          await page.goto('http://localhost:8014/tests.html');
          await page.waitForFunction(
            () => !/^Loading/.test(document.getElementById('summary').textContent),
            null, { timeout: 60000 });
          const summary = await page.evaluate(() => document.getElementById('summary').textContent);
          const failedNames = await page.evaluate(() =>
            [...document.querySelectorAll('tr.fail, li.bad')].map((el) => el.textContent.trim()));
          const groups = await page.evaluate(() =>
            [...document.querySelectorAll('h2')].map((h) => ({
              name: h.textContent.trim(),
              tests: [...(h.nextElementSibling ? h.nextElementSibling.querySelectorAll('li') : [])]
                .map((li) => ({ name: li.textContent.trim(), ok: li.className === 'ok' })),
            })).filter((g) => g.tests.length));
          console.log(summary);
          for (const f of failedNames) console.log('FAIL:', f);
          for (const e of errors) console.log('PAGE ERROR:', e);
          /* The scorecard goes on the run's own page, not just into the log.
             The published tests.html can't run the suite (it would boot a real,
             signed-in copy of the app), so it links here instead — and a link
             promising "the full scorecard" has to land on one. */
          if (process.env.GITHUB_STEP_SUMMARY) {
            const green = /^All \d+ tests pass/.test(summary) && !errors.length;
            let md = `## ${green ? '✅' : '❌'} ${summary}\n\n`;
            for (const e of errors) md += `> **Page error:** \`${e}\`\n\n`;
            for (const g of groups) {
              const bad = g.tests.filter((t) => !t.ok).length;
              md += `<details${bad ? ' open' : ''}><summary>${bad ? '❌' : '✅'} ${g.name}`
                + ` — ${g.tests.length - bad}/${g.tests.length}</summary>\n\n`;
              for (const t of g.tests) md += `- ${t.ok ? '✓' : '**✕**'} ${t.name}\n`;
              md += `\n</details>\n\n`;
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          await browser.close();
          if (failedNames.length || errors.length || !/^All \d+ tests pass/.test(summary)) process.exit(1);
          EOF
          node ci-run-tests.mjs
